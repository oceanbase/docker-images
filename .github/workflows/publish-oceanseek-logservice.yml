name: Publish accepted OceanSeek and LogService images to Docker Hub

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-oceanseek-logservice.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-oceanseek-logservice
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'oceanbase/docker-images' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: oceanseek
            tag: 4.6.3.0-482026112114
            index: sha256:88a808ee95b8da5bd9d73bb310564d779df8c3cb1587e3660abb66923b31a4c2
            replaces: sha256:2798a7c1e7b62e49ac3194a82ce5e04435f9f246603b37bd113467d72968e481
          - image: logservice
            tag: 1.3.3-152026112014
            index: sha256:8353693e9333fa5bda0900a846a8e617d93fa0d1de2f7bc6e405aeb5dc9330d8
            replaces: sha256:1cdf146c967ef2bcb7e7dca5741de8dbaba20e6fe3e8ac6c105803d06f53dd5b
    env:
      IMAGE: ${{ matrix.image }}
      TAG: ${{ matrix.tag }}
      INDEX: ${{ matrix.index }}
      REPLACES: ${{ matrix.replaces }}
    steps:
      - name: Install Skopeo if needed
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi

      - name: Copy the accepted index and both platforms from Quay
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_IO_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_IO_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          authfile="$RUNNER_TEMP/publish-auth.json"
          trap 'rm -f "$authfile"' EXIT
          printf '%s' "$DOCKER_PASSWORD" | skopeo login --authfile "$authfile" \
            --username "$DOCKER_USERNAME" --password-stdin docker.io
          printf '%s' "$QUAY_PASSWORD" | skopeo login --authfile "$authfile" \
            --username "$QUAY_USERNAME" --password-stdin quay.io
          source="docker://quay.io/oceanbase/$IMAGE@$INDEX"
          dest="docker://docker.io/oceanbase/$IMAGE:$TAG"
          copy_index() {
            skopeo copy --all --preserve-digests --retry-times 3 \
              --authfile "$authfile" "$source" "$dest"
          }
          if skopeo inspect --authfile "$authfile" --raw "$dest" > existing.json 2> inspect.err; then
            current="sha256:$(sha256sum existing.json | cut -d' ' -f1)"
            case "$current" in
              "$INDEX") echo "Already published $current" ;;
              "$REPLACES") copy_index ;;
              *) echo "::error::Unexpected current digest $current for $dest"; exit 1 ;;
            esac
          elif grep -Eiq 'manifest unknown|name unknown' inspect.err; then
            copy_index
          else
            cat inspect.err >&2
            exit 1
          fi

      - name: Pull the complete multi-platform tag anonymously
        shell: bash
        run: |
          set -euo pipefail
          dest="docker://docker.io/oceanbase/$IMAGE:$TAG"
          skopeo copy --all --src-no-creds --preserve-digests --retry-times 3 \
            "$dest" "oci:$RUNNER_TEMP/readback:accepted"
          cd "$RUNNER_TEMP/readback"
          test "$(jq -er '.manifests[0].digest' index.json)" = "$INDEX"
          cd blobs/sha256
          index=${INDEX#sha256:}
          echo "$index  $index" | sha256sum --check
          jq -e '[.manifests[].platform | [.os, .architecture]] | sort ==
            [["linux","amd64"],["linux","arm64"]]' "$index" >/dev/null
          for arch in amd64 arm64; do
            digest=$(jq -er --arg arch "$arch" '.manifests[] | select(.platform.architecture == $arch).digest' "$index")
            manifest=${digest#sha256:}
            echo "$manifest  $manifest" | sha256sum --check
            for blob in $(jq -r '.config.digest, .layers[].digest' "$manifest"); do
              echo "${blob#sha256:}  ${blob#sha256:}" | sha256sum --check
            done
            config=$(jq -er '.config.digest' "$manifest")
            jq -e --arg arch "$arch" '.os == "linux" and .architecture == $arch' "${config#sha256:}" >/dev/null
            echo "docker.io/oceanbase/$IMAGE:$TAG linux/$arch $digest (index $INDEX)" >> "$GITHUB_STEP_SUMMARY"
          done
