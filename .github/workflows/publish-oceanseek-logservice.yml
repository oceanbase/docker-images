name: Publish accepted OceanSeek and LogService images to Docker Hub

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-oceanseek-logservice.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-oceanseek-logservice
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'oceanbase/docker-images' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - oceanseek:4.6.3.0-482026112114
          - logservice:1.3.3-152026112014
    steps:
      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Copy all platforms from Quay to Docker Hub
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi
          skopeo copy --all --retry-times 3 "docker://quay.io/oceanbase/$IMAGE" "docker://docker.io/oceanbase/$IMAGE"
