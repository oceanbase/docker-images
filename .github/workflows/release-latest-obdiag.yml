name: release latest obdiag

on:
  push:
    tags:
      - 'latest-obdiag-[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Exact RPM version locked in obdiag/VERSION
        type: string
        required: true
      tested_run_id:
        description: Optional earlier latest-release run with successful unchanged image tests
        type: string
        required: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  release:
    uses: ./.github/workflows/reusable-test-and-release-obdiag.yml
    secrets: inherit
    with:
      tag_name: ${{ github.event_name == 'workflow_dispatch' && format('latest-obdiag-{0}', inputs.version) || github.ref_name }}
      latest: true
      tested-run-id: ${{ inputs.tested_run_id || '' }}
