name: release obdiag

on:
  push:
    tags:
      - 'obdiag-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release-obdiag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set image version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^obdiag-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected release tag obdiag-vX.Y.Z" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#obdiag-}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push obdiag
        uses: docker/build-push-action@v6
        with:
          context: ./obdiag
          file: ./obdiag/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ vars.DOCKER_PUSH_BASE }}/obdiag:latest
            ${{ vars.DOCKER_PUSH_BASE }}/obdiag:${{ steps.version.outputs.version }}
            quay.io/${{ vars.QUAY_IO_PUSH_BASE }}/obdiag:latest
            quay.io/${{ vars.QUAY_IO_PUSH_BASE }}/obdiag:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/obdiag:latest
            ghcr.io/${{ github.repository_owner }}/obdiag:${{ steps.version.outputs.version }}
