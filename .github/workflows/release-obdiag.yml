name: release obdiag

on:
  push:
    tags:
      - 'obdiag-[0-9]+.[0-9]+.[0-9]+-[0-9]+'

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  release:
    uses: ./.github/workflows/reusable-test-and-release-obdiag.yml
    secrets: inherit
    with:
      tag_name: ${{ github.ref_name }}
      latest: false
